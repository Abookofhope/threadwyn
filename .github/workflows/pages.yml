name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages turns Pages on by itself the first time this runs, so there
# is nothing to switch on by hand in the repository settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py counts commits for the version number
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the site
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
